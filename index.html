
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Nayla 💗</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffb6d5, #ffc8e8, #fff0f6);
      color: #8b2455;
    }
    .card {
      background: rgba(255,255,255,.85);
      padding: 30px 22px;
      margin: 20px;
      border-radius: 25px;
      box-shadow: 0 8px 30px #d65b8b44;
      max-width: 350px;
    }
    h1 { color: #e84393; }
    button {
      background: #ff5c9d;
      color: white;
      border: 0;
      border-radius: 25px;
      padding: 13px 22px;
      font-size: 16px;
    }
    #pesan { display: none; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Untuk Nayla 💗</h1>
    <p>Ada sesuatu yang ingin aku sampaikan...</p>
    <button onclick="document.getElementById('pesan').style.display='block';this.style.display='none'">
      Buka Pesan 💌
    </button>
    <div id="pesan">
      <h2>Hai, Nayla! 🌷</h2>
      <p>Aku senang bisa mengenal kamu.</p>
      <p>Kamu punya cara tersendiri untuk membuat hari-hariku terasa lebih indah.</p>
      <p>Aku cuma ingin kamu tahu kalau kamu adalah seseorang yang spesial buatku. 💗</p>
      <p>Semoga kamu selalu bahagia yaa! 🌸</p>
    </div>
  </div>
</body>
</html>
