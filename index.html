
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Nayla 💗</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #fff;
  background: linear-gradient(135deg, #ff9aaf, #f45b91, #a64ac9);
  padding: 20px;
}
.card {
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 25px;
  padding: 30px 22px;
  max-width: 390px;
  width: 100%;
  box-shadow: 0 10px 35px #81205244;
}
.heart { font-size: 65px; }
h1 { font-size: 30px; }
p { line-height: 1.8; }
button {
  border: 0;
  border-radius: 30px;
  background: white;
  color: #e74786;
  font-size: 16px;
  font-weight: bold;
  padding: 14px 22px;
  margin-top: 12px;
  cursor: pointer;
}
#pesan { display: none; }
</style>
</head>
<body>
<main class="card">
  <div class="heart">💗</div>
  <h1>Untuk Nayla</h1>
  <p>Hai, Nayla! Ada sesuatu yang ingin aku sampaikan buat kamu... 🥹</p>
  <button onclick="bukaPesan()">Buka Pesan 💌</button>
  <div id="pesan">
    <p>Aku senang bisa mengenal kamu. Kamu punya tempat spesial di pikiranku. 💖</p>
    <p>Semoga kamu selalu bahagia dan hari-harimu dipenuhi hal-hal baik. 🌷</p>
    <p>— Seseorang yang ingin membuatmu tersenyum 💕</p>
  </div>
</main>
<script>
function bukaPesan() {
  document.getElementById("pesan").style.display = "block";
}
</script>
</body>
</html>
